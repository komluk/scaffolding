name: validate

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint-json:
    name: lint JSON manifests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: jq check plugin.json
        run: jq . .claude-plugin/plugin.json > /dev/null
      - name: jq check marketplace.json
        run: jq . .claude-plugin/marketplace.json > /dev/null
      - name: jq check settings.json
        run: jq . settings.json > /dev/null

  lint-yaml-frontmatter:
    name: lint YAML frontmatter
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the yaml parser (CI only, pinned, outside the repo)
        run: npm install --silent --no-audit --no-fund --prefix "$RUNNER_TEMP/yaml" yaml@2.9.1
      - name: Validate frontmatter in agents, skills, commands and workflows/*.yaml
        run: node tests/scripts/lint-yaml.mjs "$RUNNER_TEMP/yaml"

  no-python:
    name: no python in the plugin
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: no tracked .py files and no python invocations (allowlist: .github/no-python-allowlist)
        run: bash tests/scripts/no-python-guard.sh

  lint-bash:
    name: lint bash scripts
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: bash -n hooks/*.sh
        run: |
          for f in hooks/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

  hook-tests:
    name: hook tests (node)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node --check hooks/lib/*.mjs
        run: |
          for f in hooks/lib/*.mjs hooks/lib/action-log/*.mjs copilot/*.mjs tests/hooks/*.mjs tests/hooks/fixtures/*.mjs tests/scripts/*.mjs tests/hooks/parity/run.mjs tests/hooks/parity/fuzz-*.mjs tests/hooks/parity/cases/*.mjs; do
            node --check "$f"
          done
      - name: bash tests/run-all.sh
        run: bash tests/run-all.sh

  shellcheck:
    name: shellcheck (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck hooks/*.sh
        run: |
          for f in hooks/*.sh; do
            [ -f "$f" ] || continue
            shellcheck "$f" || true
          done

  claude-plugin-validate:
    name: claude plugin validate (conditional)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - name: Try install claude-code CLI
        id: cli
        continue-on-error: true
        run: |
          if command -v npm >/dev/null 2>&1; then
            if npm install -g @anthropic-ai/claude-code 2>/dev/null; then
              echo "installed=true" >> "$GITHUB_OUTPUT"
            else
              echo "installed=false" >> "$GITHUB_OUTPUT"
              echo "claude-code CLI not installable; skipping plugin validate"
            fi
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: claude plugin validate .
        if: steps.cli.outputs.installed == 'true'
        run: claude plugin validate . || true

